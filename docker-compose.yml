version: "3.9"
services:
  db:
    image: mariadb:10.2
    environment:
      MYSQL_DATABASE: 'db'
      MYSQL_USER: 'ttmobile'
      MYSQL_PASSWORD: 'ttmobile'
      MYSQL_ROOT_PASSWORD: 'ttmobile'
    ports:
      - '3306:3306'
    expose:
      - '3306'
    volumes:
      - my-db:/var/lib/mysql
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
  server:
    build:
      context: server
    environment:
      UPLOAD_PASSWORD: example
      DB_HOST: db
    ports: 
      - 3020:3020
    volumes:
      - $PWD/server:/usr/src/app
    healthcheck:
      test: ["CMD", "curl", "-Sf", "localhost:3030"]
      timeout: 45s
      interval: 10s
      retries: 10
    depends_on:
      - db
  client:
    build:
      context: client
    environment:
      PREACT_APP_API: http://localhost:3020
      PREACT_APP_DOCS: http://localhost:8080
    ports: 
      - 8080:8080
    volumes:
      - $PWD/client:/usr/src/app
    depends_on:
      - server 


volumes:
  my-db:
